[pytest]
# Without this, running the bare `pytest` entry point (as opposed to
# `python -m pytest`) never adds the project root to sys.path, since
# tests/ has no __init__.py -- every `from core...`/`from broker...`
# import then fails with ModuleNotFoundError. `python -m pytest` happens
# to work because `-m` always prepends the current working directory,
# masking this gap -- this file makes the plain `pytest` command work too.
pythonpath = .
testpaths = tests
