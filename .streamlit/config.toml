# Editorial-lab theme. Fonts and fine styling are layered on in ui/theme.py;
# these base colors keep native widgets (inputs, tables, popovers) on-palette.
[theme]
base = "light"
primaryColor = "#4A838C"
backgroundColor = "#F4F9FA"
secondaryBackgroundColor = "#EEF5F6"
textColor = "#244248"
linkColor = "#2F6B74"
borderColor = "#CBD9DB"
baseRadius = "6px"
showWidgetBorder = true
font = "sans-serif"
codeFont = "monospace"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
