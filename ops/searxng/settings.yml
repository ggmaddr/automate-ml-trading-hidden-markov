# Minimal SearXNG config for local, single-user, JSON API use.
use_default_settings: true
general:
  instance_name: "regime-trader search"
  enable_metrics: false
search:
  formats:
    - html
    - json            # required by the research agent
server:
  bind_address: "0.0.0.0"     # inside the container; the compose file publishes it on 127.0.0.1 only
  port: 8080
  secret_key: "change-me-local-only"
  limiter: false              # single local user; the bot-limiter needs Redis and blocks JSON clients
  image_proxy: false
