# regime-trader configuration
# All tunable parameters live here, grouped by subsystem.

broker:
  paper_trading: true
  symbols:
    - SPY
    - QQQ
    - AAPL
    - MSFT
    - AMZN
    - GOOGL
    - NVDA
    - META
    - TSLA
    - AMD
  timeframe: "1Day"          # bar timeframe requested from the broker/data feed

hmm:
  n_candidates: [3, 4, 5, 6, 7]   # candidate regime counts to test during model selection
  n_init: 10                      # random restarts per candidate during EM fitting
  covariance_type: "full"         # GaussianHMM covariance structure
  min_train_bars: 252             # minimum bars (~1yr) required before a model can be trained
  stability_bars: 3               # bars a new regime must persist before being "confirmed"
  flicker_window: 20              # window (bars) over which regime flips are counted
  flicker_threshold: 4            # flips within flicker_window that trigger uncertainty mode
  min_confidence: 0.55            # minimum filtered-probability to act on a regime call

strategy:
  low_vol_allocation: 0.95
  mid_vol_allocation_trend: 0.95
  mid_vol_allocation_no_trend: 0.60
  high_vol_allocation: 0.60
  low_vol_leverage: 1.25
  rebalance_threshold: 0.10       # allocation drift (fraction) that triggers a rebalance
  uncertainty_size_mult: 0.50     # position size multiplier applied while regime is unconfirmed

risk:
  max_risk_per_trade: 0.01        # fraction of equity risked per trade
  max_exposure: 0.80              # max gross exposure as fraction of equity
  max_leverage: 1.25
  max_single_position: 0.15       # max fraction of equity in a single symbol
  max_concurrent: 5               # max concurrently open positions
  max_daily_trades: 20
  daily_dd_reduce: 0.02           # daily drawdown at which sizing is reduced
  daily_dd_halt: 0.03             # daily drawdown at which trading halts for the day
  weekly_dd_reduce: 0.05
  weekly_dd_halt: 0.07
  max_dd_from_peak: 0.10          # max drawdown from equity peak before full halt
  max_correlated_exposure: 0.30   # max combined exposure (fraction of equity) in one sector
  min_position_dollars: 100       # reject a sized position below this notional
  gap_risk_atr_mult: 3            # overnight gap-through assumption, in multiples of the stop distance
  overnight_max_pct: 0.02         # max loss (fraction of equity) if a 3x gap-through stop hits
  correlation_reduce_threshold: 0.70   # 60-day correlation with an existing position above this -> halve size
  correlation_reject_threshold: 0.85   # above this -> reject the trade outright
  max_bid_ask_spread_pct: 0.005    # reject if spread wider than this
  duplicate_order_window_seconds: 60   # block same symbol+direction within this window

backtest:
  slippage_pct: 0.0005
  initial_capital: 100000
  train_window: 252               # bars in each walk-forward training window
  test_window: 126                # bars in each walk-forward test window
  step_size: 126                  # bars to advance the window each step
  risk_free_rate: 0.045           # annualized, used for Sharpe/Sortino

monitoring:
  dashboard_refresh_seconds: 5
  alert_rate_limit_minutes: 15    # minimum time between repeated alerts of the same kind

# Phase 10: grounded Gemini research agent (read-only; see README "Phase 10").
# The Gemini model name lives here and ONLY here (GEMINI_MODEL env var overrides it).
research:
  enabled: true
  # Which model writes the research. Switch with this line or RESEARCH_PROVIDER=ollama|openai|anthropic|gemini.
  provider: ollama
  models:                          # model id per provider (the only place model names live)
    ollama: qwen3:8b               # local & free; larger models research better (see README)
    gemini: gemini-3.8-flash
    openai: ""                     # set your own, e.g. a current GPT model id
    anthropic: ""                  # set your own, e.g. a current Claude model id
  base_url: null                   # override endpoint (Ollama default http://localhost:11434; OpenAI-compatible servers)
  num_ctx: 16384                   # Ollama context window
  think: false                     # Ollama thinking models: off = faster, steadier JSON
  api_key_env: null                # default env var per provider (OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY)
  # Web search for providers without built-in search. "auto" = gemini -> Google grounding, others -> SearXNG.
  search_provider: auto
  search_base_url: http://localhost:8888   # docker compose -f ops/docker-compose.searxng.yml up -d
  # Optional: add Google Finance's news list for the ticker as an evidence source (SerpApi, needs SERPAPI_API_KEY;
  # free plan = 250 searches/month; 1 search per research run). Not Deep Search, which has no API.
  finance_news_provider: none      # none | serpapi
  finance_exchanges: [NASDAQ, NYSE]
  serpapi_free_searches_per_month: 250
  search_max_results: 8
  fetch_top_n: 4                   # pages fetched per round for fuller text (0 = search snippets only)
  max_internal_tool_calls: 5
  max_search_rounds: 2
  max_sources: 12
  min_sources: 3
  cache_ttl_minutes: 360
  max_retries: 2
  request_timeout_seconds: 300     # local models are slow; hosted APIs can use 90
  overall_timeout_seconds: 900     # hard cap across every model/search call in one research run
  default_lookback_days: 14
  max_lookback_days: 90
  enable_url_context: true         # gemini only
  enable_google_search: true       # gemini only
  resolve_source_redirects: true   # gemini only: grounding redirect links -> publisher URLs
  # Usage guard (estimates; provider billing is the source of truth). Ollama is always $0.
  # Gemini 3.x Google Search grounding is NOT on the free tier: it needs a billing-enabled key, with the first
  # 5,000 search requests/month free, then $14/1,000.
  free_grounded_searches_per_month: 5000
  grounded_search_price_per_1000_usd: 14.0
  input_price_per_million_tokens_usd: 0.75     # gemini-3.8-flash, through 2026 (doubles Jan 2027)
  output_price_per_million_tokens_usd: 3.75
  pricing: {}                      # openai/anthropic: {openai: {input_per_mtok: 0.0, output_per_mtok: 0.0}}
  monthly_budget_usd: 5.0          # refuse new paid runs once estimated spend reaches this; 0 disables
  cache_path: research_cache.db
  # Hard rails: these cannot be switched on (config validation rejects `true`).
  allow_broker_tools: false
  allow_strategy_mutation: false
  allow_risk_mutation: false
